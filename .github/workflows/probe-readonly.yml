name: probe-readonly
# Read-only diagnostic probe (no deploy, no tree changes).
on:
  push:
    branches:
      - 'probe-readonly-*'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Probe read-only 3
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee probe3.out) 2>&1
          RS() {
            ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s
          }
          echo "### A public ip"
          RS <<'EOS'
          curl -s --max-time 10 https://ifconfig.me/ip; echo
          curl -s --max-time 10 https://api.ipify.org; echo
          EOS
          echo "### B nginx site"
          RS <<'EOS'
          grep -E 'server_name|root |listen ' /etc/nginx/sites-available/xiaoguyouqu | head -20
          EOS
          echo "### C listeners"
          RS <<'EOS'
          ss -lnt | head -25
          EOS
          echo "### D deploy home/cron"
          RS <<'EOS'
          ls -la "$HOME" 2>&1 | head -20
          crontab -l 2>&1 | head -20
          EOS
          echo "### done"
          exit 0
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe3-out
          path: probe3.out
          if-no-files-found: warn
