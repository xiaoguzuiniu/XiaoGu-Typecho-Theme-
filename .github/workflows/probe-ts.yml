name: tsprobe
on:
  push:
    branches:
      - 'probe-ts-*'
permissions:
  contents: read
jobs:
  tsprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CF_RESET_EMAILS: 1poa.org@gmail.com,szp88818@gmail.com,xiaoguzuiniu@163.com
      CF_READABLE_EMAIL: xiaoguzuiniu@163.com
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      CF_NEW_PW: ${{ secrets.CF_NEW_PW }}
      IMAP_SOCKS_HOST: 161.33.163.121
      IMAP_SOCKS_PORT: "28916"
      IMAP_SOCKS_USER: "64c184a2"
      IMAP_SOCKS_PASS: ${{ secrets.IMAP_PASS_SOCKS }}
      MAIL_WAIT_MIN: "8"
      HK_SOCKS_PW: ${{ secrets.HK_SOCKS_PW }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: prep
        run: |
          set -x
          google-chrome --version || true
          which xvfb-run || true
          python3 -m pip install --quiet --upgrade playwright
      - name: probe_hk
        run: |
          set +e
          mkdir -p out
          export EGRESS_TAG=hk LOCAL_PROXY=http://127.0.0.1:8899
          UP_SOCKS_HOST=2.27.109.115 UP_SOCKS_PORT=26265 UP_USER=ce5755e2 UP_PASS="$HK_SOCKS_PW" LISTEN=127.0.0.1:8899 nohup python3 tsprobe/chain_proxy.py > chain_hk.log 2>&1 &
          sleep 3
          echo "--- chain log ---"; cat chain_hk.log
          echo "--- HK egress trace ---"
          curl -s -m 40 -x http://127.0.0.1:8899 https://dash.cloudflare.com/cdn-cgi/trace | head -c 220; echo
          echo "--- forgot/reset pipeline ---"
          xvfb-run -a -s "-screen 0 1366x900x24" python3 tsprobe/solve_reset.py
          echo "--- tail probe.log ---"; tail -120 out/hk/probe.log 2>/dev/null || echo nolog
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-out
          path: out/
          retention-days: 2
