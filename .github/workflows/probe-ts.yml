name: tsprobe
on:
  push:
    branches:
      - 'probe-ts-*'
permissions:
  contents: read
jobs:
  tsprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HK_SOCKS_HOST: 2.27.109.115
      HK_SOCKS_PORT: "26265"
      HK_SOCKS_USER: ce5755e2
      HK_SOCKS_PW: ${{ secrets.HK_SOCKS_PW }}
      CF_DASH_EMAIL: 1598289826@qq.com
      CF_DASH_PW: ${{ secrets.CF_DASH_PW }}
      CF_ACCT: 89ac63755373df2dd33dc1f4a52c1de3
      LOCAL_PROXY: http://127.0.0.1:8899
    steps:
      - name: prep
        run: |
          set -x
          google-chrome --version || google-chrome-stable --version || true
          which xvfb-run
          python3 -m pip install --quiet --upgrade playwright
          python3 -c "import playwright, sys; print('playwright', playwright.__version__)"
      - name: probe
        run: |
          set -e
          mkdir -p out
          export UP_SOCKS_HOST="$HK_SOCKS_HOST" UP_SOCKS_PORT="$HK_SOCKS_PORT" UP_USER="$HK_SOCKS_USER" UP_PASS="$HK_SOCKS_PW" LISTEN=127.0.0.1:8899
          nohup python3 tsprobe/chain_proxy.py > chain.log 2>&1 &
          sleep 3
          cat chain.log
          echo "--- chrome version under xvfb ---"
          xvfb-run -a google-chrome --version || true
          xvfb-run -a -s "-screen 0 1366x900x24" python3 tsprobe/solve.py || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-out
          path: out/
          retention-days: 2
